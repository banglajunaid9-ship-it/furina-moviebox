<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c1f" />
    <meta name="description" content="Furina Reader — read your manga, manhwa, webtoons and comics anywhere. Your world. Your stories. Your library." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Furina Reader</title>
    <style>
      /* Splash shown until React mounts — matches the in-app splash */
      #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#24205a 0%,#0b0c1f 60%);transition:opacity .4s}
      #boot svg{width:72px;height:72px;animation:bp 1.6s ease-in-out infinite}
      @keyframes bp{50%{transform:scale(1.06);filter:drop-shadow(0 0 18px #8b7bff)}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a99bff"/><stop offset="1" stop-color="#4f8dff"/></linearGradient></defs><path d="M32 4C32 4 12 26 12 40a20 20 0 0 0 40 0C52 26 32 4 32 4Z" fill="url(#bg)"/><path d="M21 38c4-2 8-2 11 1 3-3 7-3 11-1v12c-4-2-8-2-11 1-3-3-7-3-11-1Z" fill="#0b0c1f" opacity=".85"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
